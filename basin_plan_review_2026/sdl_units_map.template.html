</style></head><body><div id="map"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
const DATA = __DATA__;
const GAUGES = __GAUGES__;
const RIVERS = __RIVERS__;
const SCEN = __SCEN__;
const POL_L={"Without Development":"Without development","Pre Basin Plan":"Pre Basin Plan","Basin plan 2024":"Basin Plan 2024","Basin plan full implementation":"Full implementation"};
const CLI_L={"Historical Climate":"Historical","Warmer and Wetter 1.5 C":"Warmer, wetter 1.5°C","Warmer and Drier 1.5 C":"Warmer, drier 1.5°C","Warmer and Much Drier 1.5 C":"Warmer, much drier 1.5°C","Hotter and Wetter 2.0 C":"Hotter, wetter 2°C","Hotter and Drier 2.0 C":"Hotter, drier 2°C","Hotter and Much Drier 2.0 C":"Hotter, much drier 2°C"};
const SDLD = __SDLD__, PUINFO = __PUINFO__, PROC = __PROC__, MODN = __MODN__;   // PROC: MDBA condition / confidence / published grades / final likelihoods per assessment unit (mdba_grades/)
//   // planning-unit x objective ratings per SDL unit (MDBA pipeline); gauges per planning unit
const BPFI=SCEN.policies.indexOf("Basin plan full implementation"), BP24=SCEN.policies.indexOf("Basin plan 2024");
let POLICY=BPFI, CLIM=0;   // default Basin plan full implementation. Without Development / Pre Basin Plan are baselines only, not selectable
// policy menu: BP2024 and BPFI only; BP2024 has historical climate only, climate scenarios belong to BPFI
function scenarioMenus(sp,sc){
  sp.innerHTML=[BPFI,BP24].map(i=>`<option value="${i}">${esc(POL_L[SCEN.policies[i]]||SCEN.policies[i])}</option>`).join("");
  const fill=()=>{ const all=+sp.value===BPFI; if(!all) CLIM=0;
    sc.innerHTML=SCEN.climates.map((x,i)=>all||i===0?`<option value="${i}">${esc(CLI_L[x]||x)}</option>`:"").join(""); sc.value=CLIM; sc.disabled=!all;
    sc.title=all?"":"Climate scenarios are only available for full implementation"; };
  sp.value=POLICY; fill(); return fill; }   // selected scenario for the frequency-ratio bars
const colours = {NSW:"#4e79a7",VIC:"#59a14f",QLD:"#e15759",SA:"#f28e2b",ACT:"#b07aa1"};
const map = L.map("map").fitBounds([[-39,138],[-24.5,153]]);
const ESRI="Tiles &copy; Esri, HERE, Garmin, OpenStreetMap contributors | SDL units: MDBA (CC BY 4.0) | Rivers: HydroSHEDS | Gauges: BoM";
const gray=L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}",{maxZoom:16,attribution:ESRI}).addTo(map);
const topo=L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}",{maxZoom:19,attribution:ESRI});
map.createPane("labels").style.zIndex=650; map.getPane("labels").style.pointerEvents="none";
const grayLabels=L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Reference/MapServer/tile/{z}/{y}/{x}",{maxZoom:16,pane:"labels"}).addTo(map);
map.on("baselayerchange",e=>{ fillScale=e.layer===topo?0.3:1; units.setStyle(style); if(e.layer===topo) map.removeLayer(grayLabels); else grayLabels.addTo(map); });
const esc = s => String(s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
let fillScale=1;
const style = f => ({color:"#333",weight:1,fillColor:colours[f.properties.StateID]||"#888",
  fillOpacity:(f.properties.in_review?0.6:0.2)*fillScale,dashArray:f.properties.in_review?null:"4",
  interactive:clickable(f)});
// South Australia: only the SA Murray unit (its three assessments: Coorong/Lower Lakes/Murray Mouth, River Murray Channel, River Murray Floodplain)
// is clickable; the other SA units (not in the review results) are drawn but non-interactive so they don't get in the way
function clickable(f){ const p=f.properties; return !(p.StateID==="SA" && !p.in_review); }
const units = L.geoJSON(DATA,{style,onEachFeature:(f,l)=>{
  const p=f.properties;
  if(!clickable(f)) return;
  l.bindTooltip(esc(p.SWSDLName));
  l.bindPopup(()=>SDLD[p.SWSDLName]?sdlPopup(p):`<b>${esc(p.SWSDLName)}</b> (${esc(p.SWSDLID)}, ${esc(p.StateID)})<br>Not in the 2026 review results`,{autoPanPaddingTopLeft:[70,20],autoPanPaddingBottomRight:[20,20],maxWidth:innerWidth-60,minWidth:260});
  l.on({mouseover:e=>e.target.setStyle({weight:3}),mouseout:e=>e.target.setStyle({weight:1})});
}}).addTo(map);

// Barwon-Darling is a thin river corridor under other units: add an invisible wide hit-layer on top so it is easy to hover and click
units.eachLayer(l=>{ const p=l.feature.properties; if(!/barwon.?darling/i.test(p.SWSDLName)||!clickable(l.feature)) return;
  const hit=L.geoJSON(l.feature,{style:{color:"#000",weight:22,opacity:0,fill:true,fillOpacity:0,lineCap:"round",lineJoin:"round"}}).addTo(map);
  hit.eachLayer(x=>{ x.bindTooltip(esc(p.SWSDLName),{sticky:true});
    x.on({click:e=>{ L.DomEvent.stopPropagation(e); l.openPopup(e.latlng); }, mouseover:()=>l.setStyle({weight:3}), mouseout:()=>l.setStyle({weight:1})}); }); });

const TCOL = {"Flows & Connectivity":"#8c6bb1","Native Fish":"#4e79a7","Waterbirds":"#f28e2b","Native Vegetation":"#59a14f","Ecosystem Functions":"#76b7b2","Other Species":"#b07aa1","Other species":"#b07aa1"};
const FR_OK=0.9;   // an EWR 'succeeds' when its frequency ratio is at least 0.9 (MDBA SDL assessment, FRsp)
const mixc=(a,b,x)=>a.map((v,i)=>Math.round(v+(b[i]-v)*x));
const rate=s=>`rgb(${s<.5?mixc([209,73,91],[233,162,59],s/.5):mixc([233,162,59],[42,157,74],(s-.5)/.5)})`;   // 0 red -> .5 amber -> 1 green
const REG_ABBR={"Cease to flow":"CF","Very low flow":"VF","Baseflow":"BF","Fresh":"F","Small fresh":"SF","Large fresh":"LF","Bankfull":"BK","Bankfull flow":"BK","Overbank":"OB","Overbank small":"OB-S","Overbank large":"OB-L",
  "Low overbank flow":"OB low","Low to moderate overbank flow":"OB low-mod","Moderate overbank flow":"OB mod","Moderate to large overbank flow":"OB mod-lg","Annabranch connection":"AC","Wetland inundation":"WL","Wetland Large Fresh":"W-LF",
  "Nesting support flow":"Nest","High lake level fill":"HLLF","Mid level lake fill":"MLLF","Low level lake fill":"LLLF","Very high level fill":"VHLL","lower lakes":"Lakes","coorong":"Coorong","Annual Barrage flow":"Barrage 1y","three yearly barrage flows":"Barrage 3y","excluded":"Excl.","Unmapped":"–"};
const THEME_ABBR={"Flows & Connectivity":"FC","Native Fish":"NF","Waterbirds":"WB","Native Vegetation":"NV","Ecosystem Functions":"EF","Other Species":"OS","Unclassified":"?"};
// every flow regime the EWR_analysis_pipeline mapping can give, small -> large (then wetland / lake / barrage groups)
const REG_ORDER=["Cease to flow","Very low flow","Baseflow","Fresh","Small fresh","Large fresh","Bankfull","Bankfull flow","Annabranch connection","Overbank","Overbank small","Overbank large",
  "Low overbank flow","Low to moderate overbank flow","Moderate overbank flow","Moderate to large overbank flow","Wetland inundation","Wetland Large Fresh","Nesting support flow",
  "High lake level fill","Mid level lake fill","Low level lake fill","Very high level fill","lower lakes","coorong","Annual Barrage flow","three yearly barrage flows","excluded","Unmapped"];
const THEME_ORDER=["Flows & Connectivity","Ecosystem Functions","Waterbirds","Native Fish","Native Vegetation","Other Species","Unclassified"];   // MDBA report order
const uniq = a => [...new Set(a)];
// Build the columns/rows to draw, optionally grouped (flow regime for codes, ecological theme for objectives).
// --- MDBA SDL assessment (Surface Water Technical Methods, s4.6): FRsp rating vs Pre Basin Plan (PBP) and Without Development (WoD)
const BUF=0.05;
function frspRating(s,p,w){                                   // Figure 19; s, p, w = FRsp of scenario, PBP, WoD (0..1)
  if(p<BUF && w<BUF) return s;
  if(w<p*(1+BUF) || (s>0 && s<p)) return s/p-1;
  return (s-p)/Math.abs(w-p);
}
const CATS=[                                                  // Table 11 (change in %, lower bound inclusive)
  {min:60,  l:"Significant improvement from PBP towards WoD", c:"#2166ac", dk:1},
  {min:40,  l:"Major improvement from PBP towards WoD",       c:"#4393c3", dk:1},
  {min:20,  l:"Moderate improvement from PBP towards WoD",    c:"#92c5de"},
  {min:5,   l:"Minor improvement from PBP towards WoD",       c:"#d1e5f0"},
  {min:-5,  l:"PBP maintained",                               c:"#eeeeee"},
  {min:-20, l:"Minor decline from PBP",                       c:"#fddbc7"},
  {min:-40, l:"Moderate decline from PBP",                    c:"#f4a582"},
  {min:-60, l:"Major decline from PBP",                       c:"#d6604d", dk:1},
  {min:-Infinity, l:"Significant decline from PBP",           c:"#b2182b", dk:1}];
const sgn = p => (p>0?"+":"")+Math.round(p)+"%";
const catOf = pct => CATS.find(k=>pct>=k.min) || CATS[CATS.length-1];
const divc = x => { const g=[221,221,221]; return `rgb(${x<0?mixc(g,[178,24,43],-x):mixc(g,[33,102,172],x)})`; };   // -1 red .. 0 grey .. +1 blue
const CHG={gained:"#2f6db5", lost:"#d1495b", heldMet:"#3d3d3d", heldUnmet:"#c4c4c4"};

let THEME_ONLY=null;   // set while drawing a theme-specific matrix: only that theme's objectives, and only the EWRs that feed them
function layout(mx){
  const nC=mx.codes.length, nO=mx.objs.length;
  // columns: flow regimes small -> large; a collapsed regime is one aggregated column, otherwise one column per EWR (sheet order)
  const cols=[];
  REG_ORDER.forEach(rg=>{ const ids=mx.codes.map((c,i)=>mx.reg[i].includes(rg)&&(!THEME_ONLY||mx.cells[i].some(o=>mx.info[o][1]===THEME_ONLY))?i:-1).filter(i=>i>=0);   /* an EWR the pipeline puts in several regimes appears in each */ if(!ids.length) return;
    if(COLL_REG.has(rg)&&ids.length>1) cols.push({label:rg, codes:ids, reg:rg, grp:true});   // a regime with a single EWR is always shown as that EWR
    else ids.forEach(i=>cols.push({label:mx.codes[i], codes:[i], reg:rg, grp:false})); });
  // rows: eco themes in report order, objectives by id within a theme; a collapsed theme is one aggregated row
  const rows=[], themes=THEME_ORDER.concat(uniq(mx.info.map(d=>d[1])).filter(x=>!THEME_ORDER.includes(x))).filter(x=>!THEME_ONLY||x===THEME_ONLY); if(!THEME_ONLY) LAST_THEMES=themes;
  themes.forEach(th=>{ const ids=mx.info.map((d,i)=>d[1]===th?i:-1).filter(i=>i>=0); if(!ids.length) return;
    if(COLL_THEME.has(th)&&!THEME_ONLY) rows.push({label:th, objs:ids, theme:th, grp:true});
    else ids.sort((a,b)=>mx.objs[a].localeCompare(mx.objs[b],undefined,{numeric:true})).forEach(i=>rows.push({label:mx.objs[i], objs:[i], theme:th, desc:mx.info[i][0], grp:false})); });
  const NCL=SCEN.climates.length, sc=POLICY*NCL+CLIM, PB=SCEN.policies.indexOf("Pre Basin Plan")*NCL, WD=SCEN.policies.indexOf("Without Development")*NCL;
  const modeE=METRIC==='etp', fr=(i,k)=>mx.fr[i][k], mean=v=>{v=v.filter(x=>x!=null); return v.length?v.reduce((p,q)=>p+q,0)/v.length:null;};
  // top bars: mean EWR frequency ratio per column for the scenario, with PBP / WoD reference ticks
  cols.forEach(c=>{c.objSet=new Set(c.codes.flatMap(i=>mx.cells[i]));
    c.fr=mean(c.codes.map(i=>modeE?mx.etp[i][sc]:fr(i,sc))); c.pb=mean(c.codes.map(i=>modeE?mx.ep[i]:fr(i,PB))); c.wd=mean(c.codes.map(i=>modeE?mx.ew[i]:fr(i,WD))); c.er=mean(c.codes.map(i=>mx.er[i][sc]));
    const both3=i=>fr(i,sc)!=null&&fr(i,PB)!=null;   // EWRs that cross the 0.9 target relative to PBP: counted, never judged from an aggregated mean
    c.up=c.codes.filter(i=>both3(i)&&fr(i,sc)>=FR_OK&&fr(i,PB)<FR_OK).length; c.dn=c.codes.filter(i=>both3(i)&&fr(i,sc)<FR_OK&&fr(i,PB)>=FR_OK).length;});
  const cell = cols.map(c=>rows.map(r=>c.codes.reduce((n,i)=>n+mx.cells[i].filter(o=>r.objs.includes(o)).length,0)));
  // per ecological objective: FRsp for scenario / PBP / WoD over EWRs that have results in all three, then the rating
  const objSt = mx.objs.map((_,o)=>{
    const ids=mx.codes.map((c,i)=>i).filter(i=>mx.cells[i].includes(o)&&fr(i,sc)!=null&&fr(i,PB)!=null&&fr(i,WD)!=null);
    if(!ids.length) return null;
    const f=k=>ids.filter(i=>fr(i,k)>=FR_OK).length/ids.length, s=f(sc), p=f(PB), w=f(WD);
    return {s,p,w,r:frspRating(s,p,w),n:ids.length};});
  // ETP: the MDBA pipeline's own EWR-level rating (Rating_ETP), averaged over the EWRs mapped to each objective
  const objEt = mx.objs.map((_,o)=>{
    const ids=mx.codes.map((c,i)=>i).filter(i=>mx.cells[i].includes(o)&&mx.er[i][sc]!=null);
    if(!ids.length) return null;
    const m=f=>ids.reduce((a,i)=>a+f(i),0)/ids.length;
    return {s:m(i=>mx.etp[i][sc]), p:m(i=>mx.ep[i]), w:m(i=>mx.ew[i]), r:m(i=>mx.er[i][sc]), n:ids.length};});
  // rows: an objective rating (combined = average of its FR and ETP ratings where both exist, otherwise the one that does), or a
  // theme = the mean of its objectives' combined ratings; the FR / ETP strips of a theme are the separate means
  rows.forEach(r=>{
    const agg=arr=>{const m=arr.filter(Boolean); if(!m.length) return null; const avg=k=>m.reduce((a,b)=>a+b[k],0)/m.length; return {s:avg('s'),p:avg('p'),w:avg('w'),r:avg('r'),n:m.reduce((a,b)=>a+b.n,0)};};
    r.fr=agg(r.objs.map(o=>objSt[o])); r.et=agg(r.objs.map(o=>objEt[o]));
    const use=METRIC==='fr'?[r.fr]:METRIC==='etp'?[r.et]:[r.fr,r.et], have=use.filter(Boolean);
    const per=r.objs.map(o=>{const v=(METRIC==='fr'?[objSt[o]]:METRIC==='etp'?[objEt[o]]:[objSt[o],objEt[o]]).filter(Boolean); return v.length?v.reduce((a,b)=>a+b.r,0)/v.length:null;}).filter(v=>v!=null);
    r.rating=per.length?per.reduce((a,b)=>a+b,0)/per.length:null;});   // objective = mean of FR and ETP ratings, then theme = mean of its objectives
  // cells: gained / lost / held against PBP, per (EWR, objective) link
  const cs = cols.map(c=>rows.map(r=>{const o={g:0,l:0,hm:0,hu:0,n:0}; c.codes.forEach(i=>mx.cells[i].forEach(ob=>{ if(!r.objs.includes(ob)) return;
      if(modeE){ const e=mx.er[i][sc]; if(e==null) return; o.n++; if(e>=0.05)o.g++; else if(e<=-0.05)o.l++; else o.hm++; return; }   // ETP: improved / worse / ~unchanged vs PBP
      const a=fr(i,sc), b=fr(i,PB); if(a==null||b==null) return; o.n++; const ms=a>=FR_OK, mp=b>=FR_OK;
      if(ms&&!mp)o.g++; else if(!ms&&mp)o.l++; else if(ms)o.hm++; else o.hu++;})); return o;}));
  cols.forEach((c,ci)=>{c.n=uniq(rows.flatMap((r,ri)=>cell[ci][ri]?r.objs:[])).length;});
  rows.forEach((r,ri)=>{r.n=cols.reduce((n,c,ci)=>n+(cell[ci][ri]?c.codes.filter(i=>mx.cells[i].some(o=>r.objs.includes(o))).length:0),0);});
  return {cols, rows, cell, cs, nC, nO};
}
function upset(mx){
  if(!mx.objs.length) return `<i>No EWRs with ecological objectives for this gauge.</i>`;
  const modeE=METRIC==='etp', both=METRIC==='both';
  const L_=layout(mx), cols=L_.cols, rows=L_.rows, nR=rows.length, nCol=cols.length;
  if(!nR||!nCol) return `<i>No EWRs at this gauge feed the ${esc(THEME_ONLY||"")} objectives.</i>`;
  const C=cols.some(c=>c.grp)||rows.some(r=>r.grp)?22:20, lab=Math.max(...rows.map(r=>r.label.length))*6.3+8, barW=METRIC==='fr'?200:modeE?70:152, top=126+(modeE&&cols.some(c=>!c.grp)?34:0)+(!modeE&&cols.some(c=>c.up||c.dn)?12:0), bandH=15, PH=76;
    const clabel = c => c.grp?`${c.label.length>17?c.label.slice(0,16)+"…":c.label} (${c.codes.length})`:c.label;
  const labH=Math.max(...cols.map(c=>clabel(c).length))*6+10, my=top+bandH+labH;   // FR bars on top, then code labels, then the matrix
  const x0=barW+lab+4, W=x0+nCol*C+6, H=my+nR*C+6;
  const maxFR=modeE?1:Math.min(2,Math.max(1.25,Math.ceil(Math.max(...cols.flatMap(c=>[c.fr,c.pb,c.wd]).filter(v=>v!=null),0)*4)/4)), maxCell=Math.max(...L_.cell.flat()), showN = maxCell>1;
  const base=top-18, fy=v=>base-Math.min(v,maxFR)/maxFR*PH;   // value labels sit in the strip between the baseline and the flow-regime bands
  const f2=v=>v.toFixed(2), sgn=p=>(p>0?"+":"")+Math.round(p)+"%";
  const EX=78;   // room right of the matrix for the expand / collapse buttons
  let s=`<svg width="${W+EX}" height="${H}" viewBox="0 0 ${W+EX} ${H}">`;
  const pctTxt=p=>p>999?">+999%":p<-999?"<-999%":sgn(p), chipOf=(x0_,w_,y,rt,txtPad=3.5)=>{const pct=rt*100, k=catOf(pct);
    return {k, svg:`<rect x="${x0_}" y="${y+2}" width="${w_}" height="${C-4}" rx="3" fill="${k.c}" stroke="#0002"/><text x="${x0_+w_/2}" y="${y+C/2+txtPad}" text-anchor="middle" style="font-size:9.5px;fill:${k.dk?"#fff":"#222"}">${pctTxt(pct)}</text>`};};
  rows.forEach((r,ri)=>{const y=my+ri*C, cy=y+C/2, col=TCOL[r.theme]||"#888", src=modeE?r.et:r.fr;
    const tip = r.grp ? `${r.label}: ${r.objs.map(i=>mx.objs[i]).join(", ")}` : `${r.label} (${r.theme}): ${r.desc||"no description"}`;
    let info="no model results for the selected metric", chip=`<text x="23" y="${cy+3.5}" text-anchor="middle" style="fill:#999">n/a</text>`, strip="";

      else if(el_) keep(()=>{ if(el_.classList.contains("met")){ METRIC=el_.dataset.v; sm.value=METRIC; } else if(el_.classList.contains("xall")){ if(el_.dataset.v==="exp") COLL_REG.clear(); else REG_ORDER.forEach(r=>COLL_REG.add(r)); } else if(el_.dataset.k==="reg"){ const v=el_.dataset.v; COLL_REG.has(v)?COLL_REG.delete(v):COLL_REG.add(v); } });
      return; }
    const dc=e.target.closest(".dclose"); if(dc){ keep(()=>{ delete DRILL[dc.dataset.th]; }); return; }
    const dp=e.target.closest(".dpu"); if(dp){ keep(()=>{ const d=DRILL[dp.dataset.th]; if(d) d.gid=null; }); return; }
    const dop=e.target.closest(".dopen"); if(dop){ e.stopPropagation(); openPU(dop.dataset.pu,dop.dataset.g||null); return; }
    const gd=e.target.closest(".gd"); if(gd){ const th=gd.closest(".drill").dataset.th; keep(()=>{ const d=DRILL[th]; if(d) d.gid=gd.dataset.v; }); return; }
    const pw=e.target.closest(".puwrap"), pun=pw&&e.target.closest(".pu"); if(pun){ keep(()=>{ DRILL[pw.dataset.th]={pu:pun.dataset.v,gid:null}; }); return; }
    const x2=e.target.closest(".exp2"); if(x2){ e.stopPropagation(); const v=x2.dataset.v; if(EXP2.has(v)) EXP2.clear(); else { EXP2.clear(); EXP2.add(v); } render(); relayout(); return; }
    const x4=e.target.closest(".exp4"); if(x4){ e.stopPropagation(); const v=x4.dataset.v; EXP4.has(v)?EXP4.delete(v):EXP4.add(v); render(); relayout(); return; }
    const x3=e.target.closest(".exp3"); if(x3){ e.stopPropagation(); const v=x3.dataset.v; EXP3.has(v)?EXP3.delete(v):EXP3.add(v); render(); relayout(); return; }
    const ma=e.target.closest(".modast"); if(ma){ e.stopPropagation(); MODSEL=MODSEL===ma.dataset.v?null:ma.dataset.v; render(); relayout(); return; }
    const sb=e.target.closest(".stgtog"); if(sb){ e.stopPropagation(); STAGES_OPEN=!STAGES_OPEN; render(); relayout(); return; }
    const rb=e.target.closest(".rubtog"); if(rb){ e.stopPropagation(); RUBRIC_OPEN=!RUBRIC_OPEN; render(); relayout(); return; }
    const xa=e.target.closest(".xall,.xallp"); if(xa){ e.stopPropagation();
      if(xa.classList.contains("xallp")){ const all=LAST_PROC_THEMES; if(xa.dataset.v==="exp"){ all.forEach(t=>{ EXP2.add(t); EXP3.add(t); EXP4.add(t); }); } else { EXP2.clear(); EXP3.clear(); EXP4.clear(); } }
      else if(xa.dataset.v==="exp") COLL_THEME.clear(); else LAST_THEMES.forEach(t=>COLL_THEME.add(t));
      render(); relayout(); return; }
    const t_=e.target.closest(".tog,.pu"); if(!t_) return; e.stopPropagation();   // see gaugePopup: the redraw detaches the clicked node
    if(t_.classList.contains("pu")){ openPU(t_.dataset.v); return; }
    const v=t_.dataset.v; COLL_THEME.has(v)?COLL_THEME.delete(v):COLL_THEME.add(v); render(); relayout(); };
  sp.onchange=sc.onchange=sm.onchange=()=>{POLICY=+sp.value; CLIM=+sc.value; fillSc(); CLIM=+sc.value; METRIC=sm.value; render(); relayout();};
  map.once("popupclose",()=>hl(null));
  render(); return el;
}

// ---- planning-unit view of a gauge: its planning unit's other gauges on the map, and how they pool into the unit rating ----------
const GPU={}, PU2={}, PU_CHOICE={}, SDL_CHOICE={};
function puSig(pu){ const l=PU2[pu]; if(!l) return null; const d=SDLD[l.sdl], sc=POLICY*SCEN.climates.length+CLIM; return JSON.stringify(d.objs.map((o,i)=>[d.fr[i][l.c][sc],d.et[i][l.c][sc]])); }
function samePUs(id,pu){ const sg=puSig(pu); return sg==null?[]:(GPU[id]||[]).filter(p=>p!==pu&&puSig(p)===sg); }
let VIEW_PREF="gauge", LAST_PU=null;   // last tab / planning unit used, so clicking through gauges keeps the same view
const choosePU=id=>{ const pus=GPU[id]||[]; return LAST_PU&&pus.includes(LAST_PU)?LAST_PU:(PU_CHOICE[id]||pus[0]); };
Object.entries(PUINFO).forEach(([pu,inf])=>inf.g.forEach(g=>(GPU[g]=GPU[g]||[]).push(pu)));   // gauge -> planning units it belongs to
Object.entries(SDLD).forEach(([nm,d])=>d.pus.forEach((p,c)=>{PU2[p]={sdl:nm,c};}));            // planning unit -> its SDL unit and column
let HL=null;
function clearHL(){ if(HL){map.removeLayer(HL); HL=null;} }
function highlightGauges(centerId, pu){                       // ring every gauge in the planning unit, dashed links from the clicked gauge
  clearHL(); if(!pu) return;
  const ids=(PUINFO[pu]||{g:[]}).g, gs=GAUGES.filter(x=>ids.includes(x.id)), c=gs.find(x=>x.id===centerId), lay=[];
  gs.forEach(x=>{
    if(c&&x.id!==centerId) lay.push(L.polyline([[c.lat,c.lon],[x.lat,x.lon]],{pane:"gauges",color:"#e8590c",weight:2,dashArray:"5 4",interactive:false}));
    lay.push(L.circleMarker([x.lat,x.lon],{pane:"gauges",radius:x.id===centerId?13:10,color:"#e8590c",weight:x.id===centerId?4:3,fillOpacity:0,interactive:false})
      .bindTooltip(esc(x.id),{permanent:true,direction:"top",className:"puhl",offset:[0,-8]})); });
  HL=L.layerGroup(lay).addTo(map);
}
map.on("popupopen",e=>{ const s=e.popup._source; if(s&&s._gid){ const pus=GPU[s._gid]||[]; highlightGauges(s._gid, choosePU(s._gid)); } });
map.on("popupclose",clearHL);

function gaugeObjStats(mx){                                   // objective -> FR and ETP stats from one gauge's own EWRs (selected scenario vs PBP / WoD)
  const NCL=SCEN.climates.length, sc=POLICY*NCL+CLIM, PB=SCEN.policies.indexOf("Pre Basin Plan")*NCL, WD=SCEN.policies.indexOf("Without Development")*NCL, out={};
  mx.objs.forEach((lab,o)=>{
    const ids=mx.codes.map((c,i)=>i).filter(i=>mx.cells[i].includes(o));
    const fi=ids.filter(i=>mx.fr[i][sc]!=null&&mx.fr[i][PB]!=null&&mx.fr[i][WD]!=null); let fr=null;
    if(fi.length){ const k=K=>fi.filter(i=>mx.fr[i][K]>=FR_OK).length, n=fi.length, ks=k(sc), kp=k(PB), kw=k(WD); fr={n,ks,kp,kw,r:frspRating(ks/n,kp/n,kw/n)}; }
    const ei=ids.filter(i=>mx.er[i][sc]!=null), et=ei.length?{n:ei.length,r:mean_(ei.map(i=>mx.er[i][sc]))}:null;
    out[lab]={theme:mx.info[o][1], desc:mx.info[o][0], fr, et}; });
  return out;
}
function puSvg(g, pu, opts={}){
  const inf=PUINFO[pu]||{g:[]}, ids=inf.g.slice().sort(), gs=ids.map(id=>GAUGES.find(x=>x.id===id)).filter(Boolean);
  const sc=POLICY*SCEN.climates.length+CLIM, loc=PU2[pu], d=loc&&SDLD[loc.sdl], c=loc&&loc.c;
  const sts=gs.map(x=>gaugeObjStats(x.mxs&&x.mxs[inf.s]?x.mxs[inf.s]:x.mx));   // a gauge serving several SDL units: use this planning unit's SDL unit
  const puVal={}; if(d) d.objs.forEach((eo,o)=>{ puVal[eo]={f:d.fr[o][c][sc], e:d.et[o][c][sc], theme:d.theme[o]}; });
  const combine=(f,e)=>METRIC==="fr"?f:METRIC==="etp"?e:mean_([f,e]);
  const labels=uniq(sts.flatMap(s=>Object.keys(s)).concat(Object.keys(puVal).filter(k=>puVal[k].f!=null||puVal[k].e!=null)));
  const themeOf=l=>{ for(const s of sts) if(s[l]) return s[l].theme; return puVal[l]?puVal[l].theme:"Unclassified"; };
  const descOf=l=>{ for(const s of sts) if(s[l]&&s[l].desc) return s[l].desc; return ""; };
  // rows: objectives grouped by ecological theme; a collapsed theme is one row = mean of its objectives' (FR+ETP combined) ratings
  const themeList=opts.theme?[opts.theme]:THEME_ORDER.concat(uniq(labels.map(themeOf)).filter(x=>!THEME_ORDER.includes(x))); if(!opts.theme) LAST_THEMES=themeList;
  const rows=[]; themeList.forEach(th=>{
    const ls=labels.filter(l=>themeOf(l)===th).sort((a,b)=>a.localeCompare(b,undefined,{numeric:true})); if(!ls.length) return;
    if(COLL_THEME.has(th)&&!opts.theme) rows.push({th,ls,grp:true,l:`${th} (${ls.length})`}); else ls.forEach((l,i)=>rows.push({th,ls:[l],grp:false,l,first:i===0})); });
  const cw=66, ch=21, gap=12, bandW=16, lab=Math.max(...rows.map(r=>r.l.length),6)*6.6+10, left=bandW+lab+4, nG=gs.length;
  const wrap=(t,n)=>{ const w=String(t).split(/\s+/), out=[]; let cur=""; w.forEach(x=>{ if((cur+" "+x).trim().length>n&&cur){ out.push(cur); cur=x; } else cur=(cur+" "+x).trim(); }); if(cur) out.push(cur); return out; };   // full names, never truncated
  const WN=13, hl=Math.max(wrap(pu,WN).length,...gs.map(x=>wrap(x.name||"",WN).length)), top=8+(hl+1)*11+8, colX=i=>left+i*cw+(i===nG?gap:0), W=colX(nG)+cw+8, H=top+rows.length*ch+8;
  const EX=opts.theme?0:78;   // room right of the table for the expand / collapse buttons
  let s=`<svg width="${W+EX}" height="${H}" viewBox="0 0 ${W+EX} ${H}" style="font-size:11px">`;
  const head=(i,x,isPU,isThis)=>{ const lines=isPU?wrap(pu,WN):wrap(x.name||"",WN), t=isPU?"Planning unit":x.id;
    const tx=colX(i)+cw/2-1, link=!isPU&&!isThis;
    return `<g class="${link?(opts.gh||"gh"):""}" ${link?`data-v="${esc(x.id)}"`:""} style="cursor:${link?"pointer":"default"}"><title>${isPU?esc(pu)+" (MDBA planning-unit flow improvement)":isThis?"This gauge: "+esc(gl_(x)):"Open "+esc(x.id)+" (stays on this planning unit)"}</title>`+
      `<rect x="${colX(i)}" y="2" width="${cw-2}" height="${top-6}" rx="4" fill="${isPU?"#cfe0f3":isThis?"#fde7d3":"#eef1f5"}" stroke="${isPU?"#6f8fb8":isThis?"#e8590c":"#c5ccd6"}"/>`+
      `<text x="${tx}" y="14" text-anchor="middle" style="font-size:10.5px;font-weight:700;${link?"fill:#1f4e8c;text-decoration:underline":""}">${isThis?"◉ ":""}${esc(t)}</text>`+
      lines.map((ln,k)=>`<text x="${tx}" y="${26+k*11}" text-anchor="middle" style="font-size:9px;fill:#444">${esc(ln)}</text>`).join("")+`</g>`; };
  const gl_=x=>`${x.id}${x.name?" "+x.name:""}`;
  gs.forEach((x,i)=>{ s+=head(i,x,false,x.id===g.id); }); s+=head(nG,null,true,false);
  const cellVal=(vals)=>{ const v=mean_(vals); return v; };
  rows.forEach((r,ri)=>{ const y=top+ri*ch, sep=ri>0&&rows[ri-1].th!==r.th;
    const tip=r.grp?`${r.th}: ${r.ls.join(", ")} — click to expand`:`${r.l} (${r.th}): ${descOf(r.l)||"no description"}`;
    s+=`<rect x="0" y="${y}" width="${W}" height="${ch}" fill="${ri%2?"#f7f7f7":"#fff"}"/>`+(sep?`<line x1="0" x2="${W}" y1="${y}" y2="${y}" stroke="#8a8a8a"/>`:"")+
       `<g${opts.theme?"":` class="tog" data-k="theme" data-v="${esc(r.th)}" style="cursor:pointer"`}><title>${esc(r.th)}${opts.theme?"":` — click to ${r.grp?"expand into objectives":"collapse to the theme row"}`}</title><rect x="0" y="${y+1}" width="${bandW-2}" height="${ch-2}" rx="3" fill="${TCOL[r.th]||"#888"}" opacity="${r.grp?0.9:0.6}"/><text x="${bandW/2-1}" y="${y+ch/2+3.5}" text-anchor="middle" style="font-size:9px;fill:#fff;font-weight:700">${r.grp?"▸":(r.first?"▾":"")}</text></g>`+
       `<text x="${bandW+2}" y="${y+ch/2+4}" style="font-weight:${r.grp?700:400}"><title>${esc(tip)}</title>${esc(r.l)}</text>`;
    const K={ks:0,kp:0,kw:0,n:0};
    const draw=(X,v,tipTxt,isPUcol,isThisG)=>{
      if(v==null){ s+=`<rect x="${X+2}" y="${y+3}" width="${cw-6}" height="${ch-6}" rx="3" fill="none" stroke="#ccc" stroke-dasharray="2 2"><title>${esc(tipTxt)}: no rating</title></rect>`; return; }
      const k=catOf(v*100);
      s+=`<g><title>${esc(tipTxt)} — ${sgn(v*100)}: ${esc(k.l)}</title><rect x="${X+1}" y="${y+2}" width="${cw-4}" height="${ch-4}" rx="3" fill="${k.c}" stroke="${isPUcol?"#222":isThisG?"#e8590c":"#0002"}" stroke-width="${isPUcol?1.5:isThisG?1.6:1}"/>`+
         `<text x="${X+cw/2-1}" y="${y+ch/2+3.8}" text-anchor="middle" style="font-size:10.5px;${isPUcol?"font-weight:700;":""}fill:${k.dk?"#fff":"#222"}">${Math.abs(v*100)>999?(v>0?">+999":"<-999"):Math.round(v*100)+"%"}</text></g>`; };
    gs.forEach((x,i)=>{ const vals=r.ls.map(l=>{ const o=sts[i][l]; return o?combine(o.fr?o.fr.r:null,o.et?o.et.r:null):null; });
      r.ls.forEach(l=>{ const o=sts[i][l]; if(o&&o.fr){ K.ks+=o.fr.ks; K.kp+=o.fr.kp; K.kw+=o.fr.kw; K.n+=o.fr.n; } });
      let tp=`${x.id} · ${r.l}`; if(!r.grp){ const o=sts[i][r.l]; if(o&&o.fr) tp+=` | FR ${sgn(o.fr.r*100)} (${o.fr.ks} of ${o.fr.n} EWRs meet 0.9; PBP ${o.fr.kp}, WoD ${o.fr.kw})`; if(o&&o.et) tp+=` | ETP ${sgn(o.et.r*100)} (${o.et.n} EWRs)`; }
      draw(colX(i),cellVal(vals),tp,false,x.id===g.id); });
    const pvals=r.ls.map(l=>{ const pv=puVal[l]; return pv?combine(pv.f,pv.e):null; });
    let tp=`${pu} · ${r.l} (MDBA planning-unit rating${r.grp?"; mean of its objectives":""})`;
    if(!r.grp){ const pv=puVal[r.l]; if(pv){ if(pv.f!=null) tp+=` | FR ${sgn(pv.f*100)}`; if(pv.e!=null) tp+=` | ETP ${sgn(pv.e*100)}`; } if(K.n) tp+=` | pooled over these gauges' EWRs: ${K.ks} of ${K.n} meet 0.9 (PBP ${K.kp}, WoD ${K.kw}) → FR ${sgn(frspRating(K.ks/K.n,K.kp/K.n,K.kw/K.n)*100)}`; }
    draw(colX(nG),cellVal(pvals),tp,true,false); });
  if(!opts.theme) s+=xallBtns(W+4,top);
  return s+"</svg>";
}
